# Linux production overlay: no new TCP ports and no Caddy changes.
services:
  server-api:
    env_file:
      - path: .env.database
        format: raw
    environment:
      QWEN_UNIX_SOCKET: /run/conditional-ok/qwen.sock
    volumes:
      - /run/conditional-ok:/run/conditional-ok:ro
      - /home/linuxuser/conditional-ok-releases:/releases:ro

  # Potato Meet Worker: same DB secrets as server-api, but no Qwen socket and no release mount.
  agent-worker:
    env_file:
      - path: .env.database
        format: raw
