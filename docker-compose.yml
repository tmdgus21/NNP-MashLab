services:
  # 1. 문지기 (Caddy 리버스 프록시)
  caddy:
    image: caddy:2-alpine
    container_name: caddy-server
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP 기본 접근
      - "443:443"     # HTTPS (SSL 인증서) 접근
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server-api
    networks:
      - mash-net

  # 2. FastAPI (Caddy만 내부망에서 접속)
  server-api:
    build: ./server-api
    container_name: backend-api
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mash-net

  # 3. PostgreSQL
  postgres:
    image: postgres:18-alpine
    container_name: mashlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mashlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mashlab}
      POSTGRES_DB: ${POSTGRES_DB:-mashlab}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mashlab} -d ${POSTGRES_DB:-mashlab}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mash-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - monitoring-net
      - mash-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_PATHS_DATA: ${GRAFANA_DATA_PATH:-/var/lib/grafana}
      GF_PATHS_CONFIG: ${GRAFANA_CONFIG_PATH:-/etc/grafana/grafana.ini}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring-net
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring-net
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0 # 호스트 OS 아키텍처에 맞는 버전 사용
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    networks:
      - monitoring-net
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-mashlab}:${POSTGRES_PASSWORD:-mashlab}@postgres:5432/${POSTGRES_DB:-mashlab}?sslmode=disable"
    networks:
      - mash-net
    restart: unless-stopped

networks:
  mash-net:
    driver: bridge
  monitoring-net:
    driver: bridge

# 컨테이너가 꺼져도 데이터가 날아가지 않도록 하드디스크에 영구 저장
volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  prometheus_data:
  grafana_data: