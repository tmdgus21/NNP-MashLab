services:
  # 1. 문지기 (Caddy 리버스 프록시)
  caddy:
    image: caddy:2-alpine
    container_name: caddy-server
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP 기본 접근
      - "443:443"     # HTTPS (SSL 인증서) 접근
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server-api
      - admin-web
    networks:
      - mash-net

  # 2. FastAPI (Caddy만 내부망에서 접속; DB는 외부 PostgreSQL)
  server-api:
    build: ./server-api
    container_name: backend-api
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER:-mashlab}
      DB_PASSWORD: ${DB_PASSWORD:-mashlab}
      DB_NAME: ${DB_NAME:-mashlab}
      DB_HOST: ${DB_HOST:-172.19.0.1}
      DB_PORT: ${DB_PORT:-5432}
      DATABASE_URL: ${DATABASE_URL:-}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-0}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-https://oranganman.site}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      ADMIN_TRUSTED_PROXY_CIDRS: ${ADMIN_TRUSTED_PROXY_CIDRS:-}
      ADMIN_SMTP_HOST: ${ADMIN_SMTP_HOST:-}
      ADMIN_SMTP_PORT: ${ADMIN_SMTP_PORT:-587}
      ADMIN_SMTP_USER: ${ADMIN_SMTP_USER:-}
      ADMIN_SMTP_PASSWORD: ${ADMIN_SMTP_PASSWORD:-}
      ADMIN_SMTP_FROM: ${ADMIN_SMTP_FROM:-}
    expose:
      - "8000"
    networks:
      - mash-net

  admin-web:
    build: ./ops-dashboard
    container_name: admin-web
    restart: unless-stopped
    networks:
      - mash-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - monitoring-net
      - mash-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_DOMAIN: grafana.oranganman.site
      GF_SERVER_ROOT_URL: https://grafana.oranganman.site
      GF_PATHS_DATA: ${GRAFANA_DATA_PATH:-/var/lib/grafana}
      GF_PATHS_CONFIG: ${GRAFANA_CONFIG_PATH:-/etc/grafana/grafana.ini}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring-net
      - mash-net
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring-net
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0 # 호스트 OS 아키텍처에 맞는 버전 사용
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    networks:
      - monitoring-net
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-mashlab}:${DB_PASSWORD:-mashlab}@${DB_HOST:-172.19.0.1}:${DB_PORT:-5432}/${DB_NAME:-mashlab}?sslmode=disable"
    networks:
      - mash-net
    restart: unless-stopped

networks:
  mash-net:
    driver: bridge
  monitoring-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
