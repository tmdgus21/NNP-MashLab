name: Test and signed Android release
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: conditional-ok-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci && npm run typecheck && npm test -- --runInBand
        working-directory: apps/mobile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt && python -m unittest discover -s tests -v
        working-directory: server-api
        env:
          DATABASE_URL: sqlite://
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy with infra/deploy.sh
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: APP_DIR,SHA
          script: |
            set -eu
            cd "$APP_DIR"
            git fetch origin "$SHA"
            git checkout --detach --force FETCH_HEAD
            bash infra/deploy.sh
  release:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - run: npm ci && npm run configure
        working-directory: apps/mobile
        env:
          CONDITIONAL_OK_API_URL: https://oranganman.site/v1
      - name: Build signed APK
        working-directory: apps/mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CONDITIONAL_OK_KEYSTORE_PATH: ${{ runner.temp }}/conditional-ok.jks
          CONDITIONAL_OK_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          CONDITIONAL_OK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CONDITIONAL_OK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          umask 077
          trap 'rm -f "$CONDITIONAL_OK_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$CONDITIONAL_OK_KEYSTORE_PATH"
          bash android/gradlew -p android assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --max-workers=2
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: conditional-ok-signed-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
