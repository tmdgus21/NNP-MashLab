# Explicit opt-in only; do not use against production without review and migration.
services:
  admin-web:
    build: ./ops-dashboard
    networks: [mash-net]
    restart: unless-stopped
  caddy:
    volumes:
      - ./infra/Caddyfile.admin:/etc/caddy/Caddyfile:ro
    depends_on: [admin-web]
  server-api:
    environment:
      ADMIN_ENABLED: "1"
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-https://oranganman.site}
      ADMIN_SECRET: ${ADMIN_SECRET:?Set a random admin secret}
      ADMIN_TRUSTED_PROXY_CIDRS: ${ADMIN_TRUSTED_PROXY_CIDRS:-}
      ADMIN_SMTP_HOST: ${ADMIN_SMTP_HOST:?Set SMTP host}
      ADMIN_SMTP_PORT: ${ADMIN_SMTP_PORT:-587}
      ADMIN_SMTP_USER: ${ADMIN_SMTP_USER:?Set SMTP user}
      ADMIN_SMTP_PASSWORD: ${ADMIN_SMTP_PASSWORD:?Set SMTP password}
      ADMIN_SMTP_FROM: ${ADMIN_SMTP_FROM:?Set SMTP sender}
