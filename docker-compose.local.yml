name: mashlab-local

services:
  postgres:
    image: postgres:18-alpine
    container_name: mashlab-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: mashlab
      POSTGRES_PASSWORD: mashlab
      POSTGRES_DB: mashlab
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mashlab -d mashlab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_local_data:
