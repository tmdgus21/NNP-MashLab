[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "potato-agent"
version = "0.1.0"
description = "Potato Meet scheduling agent (LangGraph + OR-Tools)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14,<3",
    "langgraph==1.2.19",
    "ortools==9.15.6755",
]

[project.optional-dependencies]
postgres = [
    "langgraph-checkpoint-postgres==3.1.3",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
]

[tool.setuptools]
packages = ["potato_agent"]
